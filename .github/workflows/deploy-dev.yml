name: deploy-dev

# Deploy do bundle no target dev (bjd_dev):
#  - Pull Request p/ main  -> apenas VALIDATE (não faz deploy)
#  - Push na branch develop -> VALIDATE + DEPLOY
on:
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  push:
    branches: [develop]
    paths-ignore: ["**.md"]
  workflow_dispatch:

env:
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  DATABRICKS_AUTH_TYPE: oauth-m2m

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v0.276.0
      - name: Conectividade (whoami)
        run: databricks api get /api/2.0/preview/scim/v2/Me
      - name: Validate (dev)
        run: databricks bundle validate --target dev
      - name: Deploy (dev)
        if: github.event_name != 'pull_request'
        run: databricks bundle deploy --target dev --force-lock
