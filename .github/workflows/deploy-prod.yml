name: deploy-prod

# Promoção para PROD (bjd_prd) — o único deploy feito por CI/CD.
# O ambiente dev é criado manualmente (databricks bundle deploy -t dev), sem branch develop.
#  - Pull Request p/ main    -> apenas VALIDATE (gate; não faz deploy)
#  - Push/merge na branch main -> VALIDATE + DEPLOY + RUN do pipeline (target prod)
#  - Execução manual (workflow_dispatch) faz o mesmo
on:
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

env:
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  DATABRICKS_AUTH_TYPE: oauth-m2m

jobs:
  # Em PR para main: só valida (não faz deploy). Serve de gate antes do merge.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v0.276.0
      - name: Conectividade (whoami)
        run: databricks api get /api/2.0/preview/scim/v2/Me
      - name: Validate (prod)
        run: databricks bundle validate --target prod

  # Em push/merge na main (ou dispatch): valida + faz deploy em prod.
  # environment: production -> exige aprovação manual (required reviewers) antes de rodar,
  # se o Environment 'production' tiver proteção configurada em Settings -> Environments.
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v0.276.0
      # Pré-instala o Terraform e aponta o Databricks CLI pra ele via
      # DATABRICKS_TF_EXEC_PATH. Sem isso o `bundle deploy` baixa o Terraform da
      # HashiCorp e valida a assinatura PGP — que está com a chave expirada
      # ("openpgp: key expired"). Usar um binário local pula o download/verificação.
      # A versão precisa bater com a que o Databricks CLI espera (1.5.5), senão ele
      # recusa o binário local ("expected version is 1.5.5"). 1.5.5 é também a última
      # versão MPL do Terraform.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.5"
          terraform_wrapper: false
      - name: Apontar o Databricks CLI para o Terraform local
        run: echo "DATABRICKS_TF_EXEC_PATH=$(which terraform)" >> "$GITHUB_ENV"
      - name: Conectividade (whoami)
        run: databricks api get /api/2.0/preview/scim/v2/Me
      - name: Validate (prod)
        run: databricks bundle validate --target prod
      - name: Deploy (prod)
        run: databricks bundle deploy --target prod --force-lock
      - name: Summary (prod)
        run: databricks bundle summary --target prod
      - name: Run pipeline (sempre após o deploy)
        run: databricks bundle run bjd_mlops_pipeline --target prod
